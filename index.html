<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outage Analyzer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:        #0d1117;
    --surface:   #161b22;
    --surface2:  #1f2937;
    --border:    #30363d;
    --border2:   #21262d;
    --text:      #e6edf3;
    --text-muted:#8b949e;
    --text-dim:  #484f58;
    --accent:    #58a6ff;
    --accent-dim:#1f6feb33;
    --green:     #3fb950;
    --red:       #f85149;
    --yellow:    #d29922;
    --mono:      'JetBrains Mono','Fira Code','Cascadia Code',monospace;
    --sans:      -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  body { background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; line-height:1.5; min-height:100vh; }

  .header { background:var(--surface); border-bottom:1px solid var(--border); padding:14px 24px; display:flex; align-items:center; gap:12px; }
  .header-logo { width:28px;height:28px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--bg);font-family:var(--mono);flex-shrink:0; }
  .header-title { font-size:15px;font-weight:600; }
  .header-team { margin-left:8px;font-size:11px;font-family:var(--mono);background:var(--accent-dim);border:1px solid var(--accent)44;border-radius:10px;padding:2px 10px;color:var(--accent); }
  .header-sub { font-size:12px;color:var(--text-muted);margin-left:auto;font-family:var(--mono); }

  .layout { display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 57px); }

  .sidebar { background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden; }
  .sidebar-section { padding:14px 16px;border-bottom:1px solid var(--border2); }
  .sidebar-section label { display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:7px; }

  input[type="password"],input[type="text"],select {
    background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);
    font-family:var(--mono);font-size:12px;padding:7px 10px;outline:none;width:100%;transition:border-color .15s;
  }
  input:focus,select:focus { border-color:var(--accent); }
  input::placeholder { color:var(--text-dim); }
  select option { background:var(--surface2); }

  .input-row { display:flex;gap:8px; }
  .filter-row { display:flex;gap:6px;margin-bottom:7px; }
  .filter-row:last-child { margin-bottom:0; }
  .filter-row select { flex:1; }

  .btn { background:var(--accent);border:none;border-radius:6px;color:var(--bg);cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:600;padding:7px 14px;white-space:nowrap;transition:opacity .15s;flex-shrink:0; }
  .btn:hover { opacity:.85; }
  .btn:disabled { opacity:.4;cursor:not-allowed; }
  .btn-ghost { background:var(--surface2);color:var(--text);border:1px solid var(--border); }
  .btn-ghost:hover { background:var(--border);opacity:1; }
  .btn-sm { font-size:11px;padding:5px 10px; }

  .incident-list { flex:1;overflow-y:auto;padding:6px 0; }
  .incident-list::-webkit-scrollbar { width:4px; }
  .incident-list::-webkit-scrollbar-thumb { background:var(--border);border-radius:2px; }

  .incident-item { padding:10px 16px;cursor:pointer;border-left:3px solid transparent;transition:background .1s,border-color .1s; }
  .incident-item:hover { background:var(--accent-dim); }
  .incident-item.selected { background:var(--accent-dim);border-left-color:var(--accent); }
  .incident-item-title { font-size:12px;font-weight:500;line-height:1.4;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden; }
  .incident-meta { display:flex;align-items:center;gap:6px;flex-wrap:wrap; }

  .badge { font-size:10px;font-weight:600;padding:2px 6px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em;font-family:var(--mono); }
  .badge-triggered { background:#f8514922;color:var(--red); }
  .badge-acknowledged { background:#d2992222;color:var(--yellow); }
  .badge-resolved { background:#3fb95022;color:var(--green); }
  .badge-critical { background:#f8514922;color:var(--red); }
  .badge-warning { background:#d2992222;color:var(--yellow); }
  .badge-info { background:#58a6ff22;color:var(--accent); }

  .incident-time { font-family:var(--mono);font-size:10px;color:var(--text-muted); }
  .incident-service { font-size:10px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px; }
  .incident-count { font-size:10px;color:var(--text-dim);padding:6px 16px;font-family:var(--mono); }

  .empty-state { display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center;color:var(--text-muted);gap:8px; }
  .empty-icon { font-size:26px;opacity:.35; }
  .empty-text { font-size:12px;line-height:1.6; }

  .loading-row { display:flex;align-items:center;gap:8px;padding:14px 16px;color:var(--text-muted);font-size:12px; }
  .spinner { width:13px;height:13px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .error-bar { margin:8px 12px;padding:8px 12px;background:#f8514918;border:1px solid #f8514940;border-radius:6px;color:var(--red);font-size:11px;font-family:var(--mono); }

  .main { display:flex;flex-direction:column;overflow:hidden;background:var(--bg); }

  .inc-header { padding:14px 24px;border-bottom:1px solid var(--border2);background:var(--surface); }
  .inc-title { font-size:15px;font-weight:600;margin-bottom:8px;line-height:1.3; }
  .inc-meta-grid { display:flex;flex-wrap:wrap;gap:16px; }
  .meta-item { display:flex;flex-direction:column;gap:2px; }
  .meta-label { font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim); }
  .meta-value { font-size:12px;color:var(--text-muted);font-family:var(--mono); }
  .meta-value.highlight { color:var(--text); }

  .main-body { flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:var(--border) transparent; }
  .main-body::-webkit-scrollbar { width:4px; }
  .main-body::-webkit-scrollbar-thumb { background:var(--border);border-radius:2px; }

  /* Collapsible sections */
  .section { background:var(--surface);border:1px solid var(--border2);border-radius:8px;overflow:hidden; }
  .section-header { padding:10px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--surface2);user-select:none;transition:background .1s; }
  .section-header:hover { background:var(--border2); }
  .section-toggle { font-size:10px;color:var(--text-dim);transition:transform .2s;flex-shrink:0; }
  .section-toggle.open { transform:rotate(90deg); }
  .section-title { font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);flex:1; }
  .section-count { font-family:var(--mono);font-size:10px;color:var(--text-dim); }
  .section-body { padding:12px 14px;display:none; }
  .section-body.open { display:block; }

  /* Overview */
  .overview-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px; }
  .overview-item { display:flex;flex-direction:column;gap:3px; }
  .overview-label { font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim); }
  .overview-value { font-size:12px;color:var(--text);font-family:var(--mono);word-break:break-all; }
  .overview-value a { color:var(--accent);text-decoration:none; }
  .overview-value a:hover { text-decoration:underline; }

  /* TServer Actions */
  .tserver-section { background:var(--surface);border:1px solid var(--accent)44;border-radius:8px;overflow:hidden; }
  .tserver-header { padding:10px 14px;display:flex;align-items:center;gap:8px;background:#1f6feb18; }
  .tserver-title { font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);flex:1; }
  .tserver-body { padding:14px; }
  .tserver-host-row { display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap; }
  .tserver-host-label { font-size:11px;color:var(--text-muted);white-space:nowrap; }
  .tserver-host-val { font-family:var(--mono);font-size:12px;color:var(--green);flex:1;word-break:break-all; }
  .tserver-host-manual { flex:1; }
  .tserver-actions { display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap; }
  .tserver-btn { background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:600;padding:7px 16px;transition:all .15s; }
  .tserver-btn:hover { border-color:var(--accent);color:var(--accent); }
  .tserver-btn.active { background:var(--accent-dim);border-color:var(--accent);color:var(--accent); }
  .tserver-iframe-wrap { border:1px solid var(--border2);border-radius:6px;overflow:hidden;background:#fff; }
  .tserver-iframe-wrap iframe { width:100%;height:480px;border:none;display:block; }
  .tserver-vpn-note { font-size:10px;color:var(--text-dim);margin-top:6px;font-family:var(--mono); }

  /* Alerts */
  .alert-card { border:1px solid var(--border2);border-radius:6px;overflow:hidden;margin-bottom:10px; }
  .alert-card:last-child { margin-bottom:0; }
  .alert-card-header { padding:8px 12px;background:var(--surface2);display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none; }
  .alert-card-header:hover { background:var(--border2); }
  .alert-card-title { font-size:12px;font-weight:500;flex:1;color:var(--text); }
  .alert-card-body { padding:12px;display:none; }
  .alert-card-body.open { display:block; }
  .alert-detail-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:12px; }
  .alert-detail-item { display:flex;flex-direction:column;gap:3px; }
  .alert-detail-label { font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim); }
  .alert-detail-value { font-size:11px;color:var(--text-muted);font-family:var(--mono);word-break:break-all; }

  /* Event payload */
  .event-payload-wrap { margin-top:10px; }
  .event-payload-label { font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:6px; }
  .event-payload-box {
    background:var(--bg);border:1px solid var(--border2);border-radius:6px;
    padding:10px 12px;font-family:var(--mono);font-size:11px;line-height:1.6;
    white-space:pre-wrap;word-break:break-all;max-height:320px;overflow-y:auto;
    scrollbar-width:thin;scrollbar-color:var(--border) transparent;
  }
  /* JSON syntax highlight */
  .j-key    { color:#79c0ff; }
  .j-str    { color:#a5d6ff; }
  .j-num    { color:#f2cc60; }
  .j-bool   { color:#ff7b72; }
  .j-null   { color:var(--text-dim); }

  /* Monitoring details callout */
  .mon-details { background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:10px 12px;margin-bottom:10px; }
  .mon-details-title { font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--yellow);margin-bottom:6px; }
  .mon-detail-row { display:flex;gap:8px;margin-bottom:4px;font-size:12px; }
  .mon-detail-row:last-child { margin-bottom:0; }
  .mon-detail-key { font-family:var(--mono);font-size:10px;color:var(--text-dim);white-space:nowrap;padding-top:2px;min-width:90px; }
  .mon-detail-val { color:var(--text);font-family:var(--mono);font-size:11px;word-break:break-all; }
  .mon-detail-val.url { color:var(--accent); }
  .mon-detail-val.error { color:var(--red); }

  .no-selection { flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-muted);gap:10px;text-align:center;padding:40px; }
  .no-selection-icon { font-size:34px;opacity:.2; }
  .no-selection-title { font-size:15px;font-weight:600;color:var(--text-dim); }
  .no-selection-sub { font-size:12px;color:var(--text-dim);max-width:260px;line-height:1.6; }

  .action-bar { padding:12px 24px;border-top:1px solid var(--border2);display:flex;align-items:center;gap:10px;background:var(--surface); }
  .action-bar-label { font-size:12px;color:var(--text-muted);flex:1; }
  .btn-analyze { font-size:13px;padding:8px 20px; }
  .muted { color:var(--text-muted);font-size:12px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">OA</div>
  <div class="header-title">Outage Analyzer</div>
  <span class="header-team">Platform Engineering</span>
  <div class="header-sub">v0.6</div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-section">
      <label>PagerDuty API Key</label>
      <div class="input-row">
        <input type="password" id="pd-key" placeholder="u+xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
        <button class="btn" id="btn-connect">Connect</button>
      </div>
    </div>
    <div class="sidebar-section" id="filter-section" style="display:none">
      <label>Filters</label>
      <div class="filter-row">
        <select id="filter-status">
          <option value="triggered,acknowledged">Active (triggered + acked)</option>
          <option value="triggered">Triggered only</option>
          <option value="acknowledged">Acknowledged only</option>
          <option value="resolved">Resolved</option>
          <option value="triggered,acknowledged,resolved">All statuses</option>
        </select>
      </div>
      <div class="filter-row">
        <select id="filter-range">
          <option value="6">Last 6 hours</option>
          <option value="24" selected>Last 24 hours</option>
          <option value="72">Last 3 days</option>
          <option value="168">Last 7 days</option>
        </select>
        <button class="btn btn-ghost btn-sm" id="btn-refresh" title="Refresh">↻</button>
      </div>
    </div>
    <div class="incident-list" id="incident-list">
      <div class="empty-state">
        <div class="empty-icon">🔌</div>
        <div class="empty-text">Enter your PagerDuty API key<br>and click Connect</div>
      </div>
    </div>
  </div>

  <div class="main" id="main-panel">
    <div class="no-selection">
      <div class="no-selection-icon">📋</div>
      <div class="no-selection-title">No incident selected</div>
      <div class="no-selection-sub">Connect to PagerDuty, then select a PE incident to begin</div>
    </div>
  </div>
</div>

<script>
const PROXY   = 'https://corsproxy.io/?url=';
const PD_BASE = 'https://api.pagerduty.com';
const PE_TEAM = 'P3P5G66';
const CONVERT_RE = /([a-z0-9\-]+\.convertlanguage\.com)/i;

let pdKey = '';
let incidents = [];
let activeIframeAction = null;

function pdFetch(path) {
  const url = encodeURIComponent(`${PD_BASE}${path}`);
  return fetch(`${PROXY}${url}`, {
    headers: {
      'Accept': 'application/vnd.pagerduty+json;version=2',
      'Authorization': `Token token=${pdKey}`
    }
  }).then(r => {
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    return r.json();
  });
}

// ── Connect ───────────────────────────────────────────────────────────────────
document.getElementById('btn-connect').addEventListener('click', connect);
document.getElementById('pd-key').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });

function connect() {
  const key = document.getElementById('pd-key').value.trim();
  if (!key) return;
  pdKey = key;
  document.getElementById('btn-connect').textContent = '✓';
  document.getElementById('filter-section').style.display = '';
  loadIncidents();
}

// ── Load incidents ────────────────────────────────────────────────────────────
document.getElementById('btn-refresh').addEventListener('click', loadIncidents);
document.getElementById('filter-status').addEventListener('change', loadIncidents);
document.getElementById('filter-range').addEventListener('change', loadIncidents);

async function loadIncidents() {
  const statusVal = document.getElementById('filter-status').value;
  const hours     = parseInt(document.getElementById('filter-range').value);
  const since     = new Date(Date.now() - hours * 3600000).toISOString();
  const statuses  = statusVal.split(',').map(s => `statuses[]=${s}`).join('&');
  const list      = document.getElementById('incident-list');
  list.innerHTML  = `<div class="loading-row"><div class="spinner"></div>Fetching PE incidents…</div>`;
  try {
    const data = await pdFetch(`/incidents?${statuses}&since=${since}&limit=100&sort_by=created_at:desc&team_ids[]=${PE_TEAM}`);
    incidents = data.incidents || [];
    renderIncidentList();
  } catch(e) {
    list.innerHTML = '';
    showSidebarError(`Failed to load: ${e.message}`);
  }
}

function renderIncidentList() {
  const list = document.getElementById('incident-list');
  if (!incidents.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-text">No incidents found<br>for the selected filters</div></div>`;
    return;
  }
  list.innerHTML = `
    <div class="incident-count">${incidents.length} incident${incidents.length !== 1 ? 's' : ''}</div>
    ${incidents.map((inc, i) => `
      <div class="incident-item" data-idx="${i}">
        <div class="incident-item-title">${escHtml(inc.title)}</div>
        <div class="incident-meta">
          <span class="badge ${badgeClass(inc.status)}">${inc.status}</span>
          <span class="incident-time">${fmtTime(inc.created_at)}</span>
          <span class="incident-service">${escHtml(inc.service?.summary || '—')}</span>
        </div>
      </div>
    `).join('')}
  `;
  list.querySelectorAll('.incident-item').forEach(el => {
    el.addEventListener('click', () => selectIncident(parseInt(el.dataset.idx)));
  });
}

// ── Select incident ───────────────────────────────────────────────────────────
async function selectIncident(idx) {
  document.querySelectorAll('.incident-item').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll('.incident-item')[idx + 1]?.classList.add('selected');
  activeIframeAction = null;
  window._tsHost = null;

  const inc  = incidents[idx];
  const main = document.getElementById('main-panel');

  main.innerHTML = `
    <div class="inc-header">
      <div class="inc-title">${escHtml(inc.title)}</div>
      <div class="inc-meta-grid">
        <div class="meta-item"><span class="meta-label">Status</span><span class="meta-value"><span class="badge ${badgeClass(inc.status)}">${inc.status}</span></span></div>
        <div class="meta-item"><span class="meta-label">Service</span><span class="meta-value highlight">${escHtml(inc.service?.summary || '—')}</span></div>
        <div class="meta-item"><span class="meta-label">Triggered</span><span class="meta-value">${fmtTime(inc.created_at)}</span></div>
        <div class="meta-item"><span class="meta-label">Duration</span><span class="meta-value">${fmtDuration(inc.created_at, inc.resolved_at)}</span></div>
        <div class="meta-item"><span class="meta-label">Assignee</span><span class="meta-value">${escHtml(inc.assignments?.[0]?.assignee?.summary || '—')}</span></div>
        <div class="meta-item"><span class="meta-label">Urgency</span><span class="meta-value">${inc.urgency || '—'}</span></div>
      </div>
    </div>
    <div class="main-body" id="main-body">
      <div class="loading-row"><div class="spinner"></div>Loading incident details…</div>
    </div>
    <div class="action-bar">
      <div class="action-bar-label" id="action-label">Loading…</div>
      <button class="btn btn-analyze" disabled id="btn-analyze">Analyze →</button>
    </div>
  `;

  try {
    const [alertsData, logData] = await Promise.all([
      pdFetch(`/incidents/${inc.id}/alerts?limit=25&include[]=body`),
      pdFetch(`/incidents/${inc.id}/log_entries?limit=50&include[]=channel`)
    ]);

    const alerts     = alertsData.alerts     || [];
    const logEntries = logData.log_entries   || [];

    // Extract event payloads from log entries (notify_log_entry type has channel.body)
    const eventPayloads = extractEventPayloads(logEntries);

    // Detect convertlanguage host — also scan event payloads
    const convertHost = detectConvertHost(inc, alerts, eventPayloads);

    renderDetail(inc, alerts, eventPayloads, convertHost);

    document.getElementById('action-label').textContent = `Ready · ${escHtml(inc.service?.summary || '—')} · ${fmtTime(inc.created_at)}`;
    const btn = document.getElementById('btn-analyze');
    btn.disabled = false;
    btn.addEventListener('click', () => proceedToAnalysis(inc, alerts));
  } catch(e) {
    document.getElementById('main-body').innerHTML = `<div class="error-bar">Failed to load: ${e.message}</div>`;
  }
}

// ── Extract event payloads from log entries ───────────────────────────────────
function extractEventPayloads(logEntries) {
  const payloads = [];
  for (const entry of logEntries) {
    // Log entries with channel contain the raw event API payload
    const ch = entry.channel;
    if (!ch) continue;
    const body = ch.body || ch.details || ch.cef_details || ch;
    if (body && typeof body === 'object' && Object.keys(body).length > 0) {
      payloads.push({
        type: entry.type,
        time: entry.created_at,
        summary: ch.summary || entry.summary || '',
        body: body
      });
    }
  }
  return payloads;
}

// ── Detect convertlanguage host ───────────────────────────────────────────────
function detectConvertHost(inc, alerts, payloads) {
  // Search title
  let m = inc.title.match(CONVERT_RE);
  if (m) return m[1];
  // Search alerts
  for (const a of alerts) {
    const found = searchForConvert(a);
    if (found) return found;
  }
  // Search event payloads
  for (const p of payloads) {
    const found = searchForConvert(p.body);
    if (found) return found;
  }
  return null;
}

function searchForConvert(obj, depth = 0) {
  if (depth > 6 || !obj) return null;
  if (typeof obj === 'string') {
    const m = obj.match(CONVERT_RE);
    return m ? m[1] : null;
  }
  if (typeof obj === 'object') {
    for (const val of Object.values(obj)) {
      const found = searchForConvert(val, depth + 1);
      if (found) return found;
    }
  }
  return null;
}

// ── Parse monitoring details string ──────────────────────────────────────────
function parseMonDetails(detailsStr) {
  if (!detailsStr || typeof detailsStr !== 'string') return null;
  const result = {};

  // Task Name / URL
  const taskMatch = detailsStr.match(/Task Name\s*->\s*(\S+)/i);
  if (taskMatch) result.url = taskMatch[1];

  // Response code
  const codeMatch = detailsStr.match(/Error Code[:\s]+(\d+)/i) || detailsStr.match(/RESPONSE->\s*[^;]*?(\d{3})/);
  if (codeMatch) result.errorCode = codeMatch[1];

  // Reason
  const reasonMatch = detailsStr.match(/Reason[:\s]+([^\n.]+)/i);
  if (reasonMatch) result.reason = reasonMatch[1].trim();

  // Duration
  const durMatch = detailsStr.match(/Actual duration[:\s]+([\d.]+ \w+)/i) || detailsStr.match(/Duration[:\s]+([\d.]+\w*)/i);
  if (durMatch) result.duration = durMatch[1];

  // Monitoring location
  const locMatch = detailsStr.match(/Monitoring location[:\s]+(\w+)/i);
  if (locMatch) result.location = locMatch[1];

  // Timestamp
  const tsMatch = detailsStr.match(/at ([\d\/\s:APM]+)/i);
  if (tsMatch) result.timestamp = tsMatch[1].trim();

  return Object.keys(result).length ? result : null;
}

// ── Render detail ─────────────────────────────────────────────────────────────
function renderDetail(inc, alerts, eventPayloads, convertHost) {
  const body = document.getElementById('main-body');

  // TServer section
  const tserverHtml = buildTServerSection(convertHost);

  // Overview
  const overviewHtml = `
    <div class="overview-grid">
      <div class="overview-item"><div class="overview-label">Incident #</div><div class="overview-value">${inc.incident_number}</div></div>
      <div class="overview-item"><div class="overview-label">Escalation Policy</div><div class="overview-value">${escHtml(inc.escalation_policy?.summary || '—')}</div></div>
      <div class="overview-item"><div class="overview-label">Opened At</div><div class="overview-value">${fmtTime(inc.created_at)}</div></div>
      <div class="overview-item"><div class="overview-label">Resolved At</div><div class="overview-value">${inc.resolved_at ? fmtTime(inc.resolved_at) : '—'}</div></div>
      <div class="overview-item"><div class="overview-label">Duration</div><div class="overview-value">${fmtDuration(inc.created_at, inc.resolved_at)}</div></div>
      <div class="overview-item"><div class="overview-label">Alert Count</div><div class="overview-value">${alerts.length}</div></div>
      <div class="overview-item"><div class="overview-label">PagerDuty Link</div><div class="overview-value"><a href="${inc.html_url}" target="_blank">Open ↗</a></div></div>
    </div>
  `;

  // Alerts with event payloads
  const alertsHtml = alerts.length ? alerts.map((a, ai) => {
    const details    = a.body?.details || {};
    const detailKeys = Object.keys(details).filter(k => details[k] && String(details[k]).length < 400);
    const detailGrid = detailKeys.map(k => `
      <div class="alert-detail-item">
        <div class="alert-detail-label">${escHtml(k)}</div>
        <div class="alert-detail-value">${escHtml(String(details[k]))}</div>
      </div>
    `).join('');

    // Find matching event payload(s) for this alert
    const matchingPayloads = eventPayloads.filter(p =>
      p.summary && (p.summary.includes(a.summary) || p.summary.includes(a.alert_key || ''))
    );
    // Also include any payload whose body contains useful details
    const allPayloads = matchingPayloads.length ? matchingPayloads : eventPayloads.slice(0, 1);

    const payloadSections = allPayloads.map((p, pi) => {
      // Try to parse monitoring details from body.details string
      const detailsStr = p.body?.details || p.body?.description || '';
      const monParsed  = parseMonDetails(detailsStr);

      const monCallout = monParsed ? `
        <div class="mon-details">
          <div class="mon-details-title">📡 Monitoring Event Details</div>
          ${monParsed.url       ? `<div class="mon-detail-row"><div class="mon-detail-key">Task URL</div><div class="mon-detail-val url">${escHtml(monParsed.url)}</div></div>` : ''}
          ${monParsed.errorCode ? `<div class="mon-detail-row"><div class="mon-detail-key">Error Code</div><div class="mon-detail-val error">${escHtml(monParsed.errorCode)}</div></div>` : ''}
          ${monParsed.reason    ? `<div class="mon-detail-row"><div class="mon-detail-key">Reason</div><div class="mon-detail-val error">${escHtml(monParsed.reason)}</div></div>` : ''}
          ${monParsed.duration  ? `<div class="mon-detail-row"><div class="mon-detail-key">Duration</div><div class="mon-detail-val">${escHtml(monParsed.duration)}</div></div>` : ''}
          ${monParsed.location  ? `<div class="mon-detail-row"><div class="mon-detail-key">Location</div><div class="mon-detail-val">${escHtml(monParsed.location)}</div></div>` : ''}
          ${monParsed.timestamp ? `<div class="mon-detail-row"><div class="mon-detail-key">Timestamp</div><div class="mon-detail-val">${escHtml(monParsed.timestamp)}</div></div>` : ''}
        </div>
      ` : '';

      return `
        ${monCallout}
        <div class="event-payload-wrap">
          <div class="event-payload-label">Event API Payload ${allPayloads.length > 1 ? `(${pi+1}/${allPayloads.length})` : ''} · ${fmtTime(p.time)}</div>
          <div class="event-payload-box">${syntaxHighlight(p.body)}</div>
        </div>
      `;
    }).join('');

    return `
      <div class="alert-card">
        <div class="alert-card-header" onclick="toggleAlertCard(${ai})">
          <span class="badge ${a.severity === 'critical' ? 'badge-critical' : a.severity === 'warning' ? 'badge-warning' : 'badge-info'}">${a.severity || '?'}</span>
          <div class="alert-card-title">${escHtml(a.summary || '—')}</div>
          <span class="section-toggle" id="alert-toggle-${ai}">▶</span>
        </div>
        <div class="alert-card-body" id="alert-body-${ai}">
          <div class="alert-detail-grid">
            <div class="alert-detail-item"><div class="alert-detail-label">Status</div><div class="alert-detail-value">${a.status || '—'}</div></div>
            <div class="alert-detail-item"><div class="alert-detail-label">Service</div><div class="alert-detail-value">${escHtml(a.service?.summary || '—')}</div></div>
            <div class="alert-detail-item"><div class="alert-detail-label">Integration</div><div class="alert-detail-value">${escHtml(a.integration?.summary || '—')}</div></div>
            <div class="alert-detail-item"><div class="alert-detail-label">Alert Times</div><div class="alert-detail-value">${fmtTime(a.created_at)}${a.resolved_at ? ' → ' + fmtTime(a.resolved_at) : ''}</div></div>
            <div class="alert-detail-item"><div class="alert-detail-label">Alert Key</div><div class="alert-detail-value">${escHtml(a.alert_key || a.dedup_key || '—')}</div></div>
            ${detailGrid}
          </div>
          ${payloadSections || '<div class="muted">No event payload available.</div>'}
        </div>
      </div>
    `;
  }).join('') : '<div class="muted">No alerts found.</div>';

  body.innerHTML = `
    ${tserverHtml}
    ${makeSection('overview', 'Overview', overviewHtml, null, true)}
    ${makeSection('alerts',   'Alerts',   alertsHtml,   alerts.length, true)}
  `;

  // Wire section toggles
  body.querySelectorAll('.section-header').forEach(h => {
    h.addEventListener('click', () => {
      const id = h.dataset.section;
      document.getElementById(`sec-body-${id}`).classList.toggle('open');
      document.getElementById(`sec-toggle-${id}`).classList.toggle('open');
    });
  });

  // Wire manual host input
  const manualInput = document.getElementById('ts-manual-input');
  if (manualInput) {
    manualInput.addEventListener('keydown', e => { if (e.key === 'Enter') applyManualHost(manualInput.value.trim()); });
    document.getElementById('ts-manual-btn')?.addEventListener('click', () => applyManualHost(manualInput.value.trim()));
  }
}

// ── TServer section ───────────────────────────────────────────────────────────
function buildTServerSection(host) {
  const hostRow = host
    ? `<div class="tserver-host-row">
         <div class="tserver-host-label">🟢 Auto-detected:</div>
         <div class="tserver-host-val">${escHtml(host)}</div>
       </div>`
    : `<div class="tserver-host-row">
         <div class="tserver-host-label">⚠️ Not detected — enter manually:</div>
         <input type="text" id="ts-manual-input" class="tserver-host-manual" placeholder="client.convertlanguage.com">
         <button class="btn btn-sm" id="ts-manual-btn">Set</button>
       </div>`;

  return `
    <div class="tserver-section" id="tserver-section">
      <div class="tserver-header">
        <div class="tserver-title">⚡ TServer Actions</div>
      </div>
      <div class="tserver-body">
        ${hostRow}
        <div class="tserver-actions" id="tserver-actions" ${!host ? 'style="display:none"' : ''}>
          <button class="tserver-btn" id="btn-vmstate" onclick="loadTServerIframe('vmstate')">🖥 VM State</button>
          <button class="tserver-btn" id="btn-status"  onclick="loadTServerIframe('status')">✅ TServer Status</button>
        </div>
        <div id="tserver-iframe-container"></div>
        <div class="tserver-vpn-note">⚠️ VPN required for mpactionid endpoints</div>
      </div>
    </div>
  `;
}

function applyManualHost(host) {
  if (!host) return;
  if (!host.includes('.convertlanguage.com')) host += '.convertlanguage.com';
  window._tsHost = host;
  const row = document.querySelector('.tserver-host-row');
  if (row) row.innerHTML = `<div class="tserver-host-label">✏️ Manual:</div><div class="tserver-host-val">${escHtml(host)}</div>`;
  document.getElementById('tserver-actions').style.display = '';
}

window.loadTServerIframe = function(action) {
  const host = window._tsHost || document.querySelector('.tserver-host-val')?.textContent?.trim();
  if (!host) return;

  if (activeIframeAction === action) {
    activeIframeAction = null;
    document.getElementById('tserver-iframe-container').innerHTML = '';
    document.getElementById('btn-vmstate').classList.remove('active');
    document.getElementById('btn-status').classList.remove('active');
    return;
  }

  activeIframeAction = action;
  document.getElementById('btn-vmstate').classList.toggle('active', action === 'vmstate');
  document.getElementById('btn-status').classList.toggle('active', action === 'status');

  const mpactionid = action === 'vmstate' ? '1073741829' : '1';
  const url = `https://${host}/?mpactionid=${mpactionid}`;

  document.getElementById('tserver-iframe-container').innerHTML = `
    <div class="tserver-iframe-wrap">
      <iframe src="${escHtml(url)}" title="${action === 'vmstate' ? 'VM State' : 'TServer Status'}"></iframe>
    </div>
  `;
};

window.toggleAlertCard = function(idx) {
  document.getElementById(`alert-body-${idx}`).classList.toggle('open');
  document.getElementById(`alert-toggle-${idx}`).classList.toggle('open');
};

function makeSection(id, title, content, count, defaultOpen) {
  return `
    <div class="section">
      <div class="section-header" data-section="${id}">
        <span class="section-toggle ${defaultOpen ? 'open' : ''}" id="sec-toggle-${id}">▶</span>
        <div class="section-title">${title}</div>
        ${count !== null && count !== undefined ? `<div class="section-count">${count}</div>` : ''}
      </div>
      <div class="section-body ${defaultOpen ? 'open' : ''}" id="sec-body-${id}">${content}</div>
    </div>
  `;
}

// ── Syntax highlight JSON ─────────────────────────────────────────────────────
function syntaxHighlight(obj) {
  const json = JSON.stringify(obj, null, 2);
  return escHtml(json).replace(
    /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
    match => {
      if (/^"/.test(match)) {
        if (/:$/.test(match)) return `<span class="j-key">${match}</span>`;
        return `<span class="j-str">${match}</span>`;
      }
      if (/true|false/.test(match)) return `<span class="j-bool">${match}</span>`;
      if (/null/.test(match))       return `<span class="j-null">${match}</span>`;
      return `<span class="j-num">${match}</span>`;
    }
  );
}

function proceedToAnalysis(inc, alerts) {
  alert(`Phase 2 coming up.\n\nIncident: ${inc.title}\nService: ${inc.service?.summary}\nTriggered: ${fmtTime(inc.created_at)}\n\nNext: TServer log ingestion + Claude API call.`);
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function showSidebarError(msg) {
  const list = document.getElementById('incident-list');
  const div  = document.createElement('div');
  div.className   = 'error-bar';
  div.textContent = msg;
  list.prepend(div);
  setTimeout(() => div.remove(), 7000);
}

function badgeClass(s) {
  return { triggered:'badge-triggered', acknowledged:'badge-acknowledged', resolved:'badge-resolved' }[s] || 'badge-triggered';
}
function fmtTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false });
}
function fmtDuration(start, end) {
  if (!start) return '—';
  const ms = (end ? new Date(end) : new Date()) - new Date(start);
  const h  = Math.floor(ms / 3600000);
  const m  = Math.floor((ms % 3600000) / 60000);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}
function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
